<!doctype html><html><head><meta charset="utf-8"><title>Orders</title><link href="/static/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="/dashboard">System Control Center</a><a href="/logout" class="btn btn-sm btn-danger">Logout</a></nav><main class="container py-5"><div class="d-flex justify-content-between"><h1>Orders</h1><a class="btn btn-primary" href="/checkout">New order</a></div>{% for o in orders %}<div class="card shadow-sm my-3"><div class="card-body"><h5>Order #{{ o.order_id }}</h5><p class="text-muted">{{ o.created_at }} · {{ o.customer_name }} · <span class="badge bg-secondary">{{ o.status }}</span></p><p class="fw-bold">Total: ${{ o.order_total }}</p><a href="/orders/{{ o.order_id }}?back=orders" class="btn btn-outline-primary">View details</a></div></div>{% endfor %}</main></body></html>
