<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Users and Roles - System Control Center</title><link href="/static/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3 justify-content-between mb-4"><a class="navbar-brand" href="/dashboard">System Control Center</a><span class="text-white">{{ username }} <span class="badge bg-secondary">admin</span> <a href="/logout" class="btn btn-sm btn-danger ms-2">Logout</a></span></nav>
<main class="container"><div class="d-flex justify-content-between align-items-center mb-4"><h1>Users and Roles</h1><button class="btn btn-success" data-bs-toggle="collapse" data-bs-target="#add-user">Create user</button></div>
<form id="add-user" class="collapse card card-body mb-4" action="/users/create" method="POST"><div class="row g-2"><div class="col-md-2"><input class="form-control" name="username" placeholder="Username" required></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col-md-2"><input class="form-control" name="password" type="password" placeholder="Password" required></div><div class="col-md-2"><select class="form-select" name="role"><option>viewer</option><option>operator</option><option>admin</option></select></div><div class="col-md-2"><button class="btn btn-success" type="submit">Save user</button></div></div></form>
<div class="card shadow-sm"><div class="card-body"><table class="table table-hover align-middle m-0"><thead class="table-dark"><tr>{% for col in columns %}<th>{{ col }}</th>{% endfor %}<th>Actions</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.id }}</td><td><strong>{{ row.username }}</strong></td><td>{{ row.email }}</td><td><span class="badge bg-secondary">{{ row.role }}</span></td><td>{{ row.created_at }}</td><td><form action="/users/update" method="POST" class="mb-1"><input type="hidden" name="id" value="{{ row.id }}"><input type="hidden" name="username" value="{{ row.username }}"><input type="hidden" name="email" value="{{ row.email }}"><input type="hidden" name="role" value="{{ row.role }}"><input class="form-control form-control-sm mb-1" name="password" type="password" placeholder="New password"><button class="btn btn-sm btn-warning" type="submit">Update</button></form><form action="/users/delete/{{ row.id }}" method="POST"><button class="btn btn-sm btn-danger" type="submit">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div></main>
</body></html>
